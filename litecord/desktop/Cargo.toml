[package]
name = "litecord-desktop"
version = "2.3.2"
edition = "2021"
build = "build.rs"
description = "LiteCord's native desktop app, in Rust with GPUI (via GPUI Kit)"
license = "MIT"

[[bin]]
name = "litecord"
path = "src/main.rs"

# Headless call test: joins a room and voice channel and prints connection and audio stats.
[[bin]]
name = "callbot"
path = "src/callbot.rs"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
gpui-kit = "0.9"
notify-rust = "4.18.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", features = ["json"] }
# glib-main-loop: runs the GLib loop that the screen-share portal (PipeWire on Wayland) needs.
libwebrtc = { version = "0.4.0", features = ["glib-main-loop"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
smallvec = "1"
log = "0.4"
cpal = "0.17"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
# AI noise suppression for the microphone (RNNoise in pure Rust), like the web app's.
nnnoiseless = { version = "0.5.2", default-features = false }
# Checks downloaded updates against the release's SHA256SUMS.txt.
sha2 = "0.11.1"

# Windows: stream sound from every app except LiteCord itself (process loopback).
[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
