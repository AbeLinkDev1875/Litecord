# Puts the web app live on Cloudflare whenever its files change on main, so the site always
# matches GitHub. "Run workflow" on the Actions tab deploys main again by hand.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the LiteCord Cloudflare account's ID
name: Deploy web app
on:
  push:
    branches: [main]
    paths: ["litecord/cloudflare/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to the repository (see the top of this file)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: litecord/cloudflare
          wranglerVersion: "4.158.0"
          command: deploy
